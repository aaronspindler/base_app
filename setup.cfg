# Legacy configuration file for tools that don't support pyproject.toml yet
# Most configuration has been moved to pyproject.toml

[metadata]
name = base-app
version = attr: base_app.__version__

[options]
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
exclude =
    tests*
    docs*
    scripts*

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    migrations,
    venv,
    env,
    .venv,
    .tox,
    dist,
    build,
    *.egg-info,
    .coverage,
    .pytest_cache,
    htmlcov,
    node_modules,
    staticfiles,
    media
per-file-ignores =
    __init__.py:F401
    */settings/*.py:F401,F403
    */tests/*.py:S101
