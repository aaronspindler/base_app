# GitHub Labels Configuration
# This file defines all the labels needed for the dependabot auto-merge workflow
# To apply these labels, use: gh label create --repo owner/repo --file .github/labels.yml

- name: "auto-merge"
  color: "0E8A16"
  description: "Automatically merge when all checks pass"

- name: "security"
  color: "D93F0B"
  description: "Security-related updates and vulnerabilities"

- name: "dependencies"
  color: "0366D6"
  description: "Dependency updates and package management"

- name: "python"
  color: "3776AB"
  description: "Python-specific changes and updates"

- name: "github-actions"
  color: "2088FF"
  description: "GitHub Actions workflow changes"

- name: "docker"
  color: "2496ED"
  description: "Docker-related changes and updates"

- name: "bug"
  color: "D73A4A"
  description: "Something isn't working"

- name: "documentation"
  color: "0075CA"
  description: "Improvements or additions to documentation"

- name: "enhancement"
  color: "A2EEEF"
  description: "New feature or request"

- name: "good first issue"
  color: "7057FF"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "invalid"
  color: "E4E669"
  description: "Something is wrong"

- name: "question"
  color: "CC317C"
  description: "Further information is requested"

- name: "wontfix"
  color: "FFFFFF"
  description: "This will not be worked on"
